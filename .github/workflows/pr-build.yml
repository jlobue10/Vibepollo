---
name: Validate Windows pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install host test headers
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libboost-dev
      - name: Check input teardown, feedback and raw haptic backpressure
        run: |
          python3 tests/input/test_disconnect_release.py
          python3 tests/input/test_controller_touch_batch.py
          python3 tests/input/test_controller_trigger_batch.py
          python3 tests/input/test_mouse_batch_arithmetic.py
          python3 tests/input/test_haptic_queue.py
          python3 tests/input/test_gamepad_feedback.py
          python3 tests/input/test_vhf_fallback.py
          python3 tests/input/test_netfloat_validation.py
          python3 tests/input/test_vigem_touch_pointers.py
      - name: Check SC2026 client-to-driver click fidelity
        run: |
          git submodule update --init --depth 1 third-party/moonlight-common-c third-party/libvirtualgamepad
          python3 tests/input/test_sc26_buttons.py
      - name: Check video FEC wire counts and parity recovery
        run: |
          git submodule update --init --depth 1 third-party/nanors
          python3 tests/input/test_video_fec_wire.py
      - name: Check queued and in-flight stream packet lifetimes
        run: |
          python3 tests/input/test_stream_packet_lifetime.py
          python3 tests/input/test_session_start_failure.py
      - name: Check ANNOUNCE bounds, the control-thread lifecycle gate and audio encode failure scope
        run: |
          python3 tests/input/test_announce_validation.py
          python3 tests/input/test_control_thread_lifecycle_gate.py
          python3 tests/input/test_control_replay_window.py
          python3 tests/input/test_audio_encode_failure.py
          python3 tests/input/test_audio_surround_layout.py
          python3 tests/input/test_wasapi_silence.py
      - name: Check the pre-capture waits, the failed-start limiter release and the deferred-launch claim
        run: |
          python3 tests/input/test_recv_ping_shutdown.py
          python3 tests/input/test_start_guard_limiter.py
          python3 tests/input/test_deferred_launch_claim.py
          python3 tests/input/test_deferred_launch_lifecycle.py
          python3 tests/input/test_capture_display_wait.py
          python3 tests/input/test_encoder_retry.py
      - name: Check IPC framing bounds and overlapped completion races
        run: python3 tests/input/test_ipc_pipe_contract.py
      - name: Check malformed app catalog entry recovery
        run: python3 tests/input/test_app_catalog_error.py
      - name: Check mouse release ownership and Windows mouse mapping
        run: |
          python3 tests/input/test_delayed_mouse_release.py
          python3 tests/input/test_windows_absolute_mouse.py
          python3 tests/input/test_windows_mouse_keys.py
          python3 tests/input/test_windows_pointer_offset.py
      - name: Check the web UI request policies (CSRF store, login backoff, cookie names, revoke-all)
        run: |
          python3 tests/input/test_csrf_store.py
          python3 tests/input/test_login_backoff.py
          python3 tests/input/test_cookie_extract.py
          python3 tests/input/test_session_revoke_all.py
      - name: Check the launch-argument and environment-block guards, config comment parsing and the server-command budget
        run: |
          python3 tests/input/test_env_block_nul.py
          python3 tests/input/test_config_hash_value.py
          python3 tests/input/test_server_cmd_budget.py
          python3 tests/input/test_api_token_scopes.py
      - name: Check the Playnite media path guard and the anonymous handshake name bound
        run: |
          python3 tests/input/test_playnite_path_guard.py
          python3 tests/input/test_anon_handshake_name.py
      - name: Check Remote Monitor lease recovery after a lost display
        run: python3 tests/input/test_remote_monitor_lease_recovery.py
      - name: Check the launch-argument bracket scanner stays in bounds
        run: python3 tests/input/test_find_match_bounds.py
      - name: Check the WebRTC option bounds and integer parsing
        run: python3 tests/input/test_webrtc_option_bounds.py
      - name: Check the /launch request path (single IV derivation, no 403 fall-through)
        run: python3 tests/input/test_launch_fallthrough.py
      - name: Check the Playnite IPC boundary (partial snapshot reset, pipe instance flags)
        run: python3 tests/input/test_playnite_ipc_hardening.py
      - name: Check the launch privilege boundaries and the program resolver
        run: |
          python3 tests/input/test_launch_privilege_boundaries.py
          python3 tests/input/test_run_command_path.py
      - name: Fetch the libwebrtc C header the browser/peer-state harnesses read
        run: git submodule update --init --depth 1 third-party/libwebrtc
      - name: Check browser input context and peer-state bridge lifetimes
        run: |
          python3 tests/input/test_browser_disconnect.py
          python3 tests/input/test_browser_gamepad_admission.py
          python3 tests/input/test_browser_numeric_input.py
          python3 tests/input/test_peer_state_bridge.py
      - name: Check PyroWave fence import and conversion timeout ordering
        run: python3 tests/input/test_pyrowave_sync.py

  windows:
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      build_only: true
      build_tests: true
      release_commit: ${{ github.sha }}
      # A valid, explicitly non-release version for the existing MSI build checks.
      release_version: '0.0.1'
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
